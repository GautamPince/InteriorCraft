name: Configure Branch Protection

on:
  workflow_dispatch:

jobs:
  protect-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Configure branch protection for main
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';
            await github.rest.repos.updateBranchProtection({
              owner,
              repo,
              branch,
              required_status_checks: {
                strict: true,
                contexts: []
              },
              enforce_admins: false,
              required_pull_request_reviews: {
                dismissal_restrictions: {},
                dismiss_stale_reviews: true,
                require_code_owner_reviews: false,
                required_approving_review_count: 1
              },
              restrictions: null
            });
            core.info(`Branch protection applied to ${owner}/${repo}@${branch}`);

# Note: This workflow requires a repository secret named 'GH_PAT' with a
# personal access token that has the 'repo' scope. After adding the secret,
# run this workflow manually from the Actions tab to apply protection to `main`.
