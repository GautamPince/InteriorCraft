version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: casacraft_postgres
    restart: always
    environment:
      POSTGRES_USER: casacraft_user
      POSTGRES_PASSWORD: casacraft_password
      POSTGRES_DB: casacraft_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casacraft_user -d casacraft_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casacraft_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://casacraft_user:casacraft_password@postgres:5432/casacraft_db
      - JWT_SECRET_KEY=casacraft_super_secret_jwt_key_2026_production_grade
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - ADMIN_EMAIL=admin@casacraft.in
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: casacraft_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
